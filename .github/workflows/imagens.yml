name: imagens

# Gera as imagens de cena (Animagine XL 4.0) em CPU, dividido em várias máquinas de 4 núcleos.
# Disparado por ferramentas/gerar_imagens_github.py (C:\agente-video), que sobe pedido.json
# como release.

on:
  workflow_dispatch:
    inputs:
      pacote:
        description: "Tag da release com pedido.json"
        required: true
      partes:
        description: "Em quantas máquinas dividir (máx. 20)"
        default: "20"
      cache_key:
        description: "Chave de cache do modelo (varia por combinação modelo+lora)"
        default: "animagine-xl-4.0-fp32"

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  HF_HOME: ${{ github.workspace }}/hf

jobs:
  planejar:
    runs-on: ubuntu-latest
    outputs:
      partes: ${{ steps.p.outputs.partes }}
    steps:
      - id: p
        run: python3 -c "import json;print('partes='+json.dumps(list(range(int('${{ inputs.partes }}')))))" >> "$GITHUB_OUTPUT"

  gerar:
    needs: planejar
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJSON(needs.planejar.outputs.partes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: imagens/requirements.txt
      - name: Dependências (torch CPU)
        run: pip install -q -r imagens/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Modelo em cache
        uses: actions/cache@v4
        with:
          path: hf
          key: ${{ inputs.cache_key }}
      - name: Pedido
        run: gh release download "${{ inputs.pacote }}" -p pedido.json -R "${{ github.repository }}"
      - name: Gerar parte ${{ matrix.parte }}
        run: python imagens/gerar_cpu.py pedido.json --parte ${{ matrix.parte }} --partes ${{ inputs.partes }} --saida out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imagens-${{ matrix.parte }}
          path: out/*.jpg
          retention-days: 2
          if-no-files-found: ignore
